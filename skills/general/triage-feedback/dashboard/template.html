<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review triage</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1f2328; --muted: #656d76; --border: #d0d7de; --card: #ffffff;
    --soft: #f6f8fa; --code: #f6f8fa; --accent: #0969da;
    --ok: #1a7f37; --ok-bg: #dafbe1; --bad: #cf222e; --bad-bg: #ffebe9;
    --warn: #9a6700; --warn-bg: #fff1e5; --hl: #fff8c5; --add: #2da44e;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --fg: #e6edf3; --muted: #8d96a0; --border: #30363d; --card: #161b22;
      --soft: #1c2128; --code: #0d1117; --accent: #4493f8;
      --ok: #3fb950; --ok-bg: #12261e; --bad: #f85149; --bad-bg: #2d1214;
      --warn: #d29922; --warn-bg: #2e2112; --hl: #3a3218; --add: #3fb950;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--sans); }
  main { max-width: 1180px; margin: 0 auto; padding: 24px 20px 120px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code { font-family: var(--mono); font-size: 12.5px; background: var(--soft); padding: 1px 5px; border-radius: 4px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; }
  .sub code { font-size: 12px; }

  .bar { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--border);
         padding: 12px 0; margin: 16px 0 20px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
  .clashes { font-size: 13px; font-variant-numeric: tabular-nums; }
  .clashes:empty { display: none; }
  .c-ok { color: var(--ok); } .c-bad { color: var(--bad); } .c-pend { color: var(--muted); } .c-warn { color: var(--warn); }
  .progress { flex: 1 1 160px; height: 8px; background: var(--soft); border-radius: 4px; overflow: hidden; display: flex; min-width: 120px; }
  .progress i { display: block; height: 100%; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; border-right: 1px solid var(--border); background: var(--card); color: var(--fg); padding: 4px 10px; font: inherit; font-size: 13px; cursor: pointer; }
  .seg button:last-child { border-right: 0; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .seg button b { font-variant-numeric: tabular-nums; }
  .seg button[aria-pressed="true"] b { color: inherit; }
  .seg button.zero:not([aria-pressed="true"]) { color: var(--muted); }
  .tools { display: flex; gap: 8px; align-items: center; margin-left: auto; }
  .btn { border: 1px solid var(--border); background: var(--card); color: var(--fg); padding: 4px 10px; border-radius: 6px; font: inherit; font-size: 13px; cursor: pointer; }
  .btn:hover { background: var(--soft); }
  label.chk { font-size: 13px; display: inline-flex; gap: 5px; align-items: center; color: var(--muted); }

  .card { border: 1px solid var(--border); border-radius: 8px; background: var(--card); margin-bottom: 10px; scroll-margin-top: 80px; }
  .card.approved { border-left: 4px solid var(--ok); }
  .card.rejected { border-left: 4px solid var(--bad); }
  .card.focus { box-shadow: 0 0 0 2px var(--accent); }
  .head { display: grid; grid-template-columns: 28px 44px 1fr auto; gap: 10px; align-items: center; padding: 10px 14px; cursor: pointer; user-select: none; }
  .head:hover { background: var(--soft); border-radius: 8px; }
  .status { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; border: 2px solid var(--border); color: var(--muted); }
  .approved .status { background: var(--ok); border-color: var(--ok); color: #fff; }
  .rejected .status { background: var(--bad); border-color: var(--bad); color: #fff; }
  .fid { font-family: var(--mono); font-weight: 600; color: var(--muted); }
  .title { font-weight: 600; }
  .loc { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .tag { font-size: 11.5px; padding: 1px 8px; border-radius: 10px; border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
  .tag.p1 { color: var(--bad); border-color: var(--bad); }
  .tag.p2 { color: var(--warn); border-color: var(--warn); }
  .tag.older { border-style: dashed; }
  .tag.conflict { color: var(--warn); border-color: var(--warn); }
  .clash .tag.conflict { background: var(--warn); color: #fff; }

  .body { display: none; padding: 4px 16px 16px; border-top: 1px solid var(--border); }
  .open .body { display: block; }
  .body h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 0 6px; }
  .body p { margin: 0 0 6px; max-width: 900px; }
  .counter { background: var(--soft); border-radius: 6px; padding: 8px 12px; color: var(--muted); max-width: 900px; }
  ul.ev { margin: 0; padding-left: 18px; }

  .code { border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin: 6px 0 12px; }
  .code-h { display: flex; justify-content: space-between; gap: 10px; background: var(--soft); padding: 5px 10px; font-size: 12px; border-bottom: 1px solid var(--border); }
  .code-h span { font-family: var(--mono); color: var(--muted); }
  .rows { background: var(--code); font: 12.5px/1.55 var(--mono); overflow-x: auto; max-height: 460px; overflow-y: auto; }
  .row { display: grid; grid-template-columns: 6px 48px 1fr; min-width: max-content; }
  .wrap .row { min-width: 0; }
  .row.add .g { background: var(--add); opacity: .55; }
  .row .n { text-align: right; padding-right: 10px; color: var(--muted); user-select: none; }
  .row .t { white-space: pre; padding-right: 12px; }
  .wrap .row .t { white-space: pre-wrap; word-break: break-word; }
  .row.hl { background: var(--hl); }
  .row.hl .n { color: var(--fg); font-weight: 700; }
  .row.del { background: var(--bad-bg); }
  .row.ins { background: var(--ok-bg); }
  .row.del .n::before { content: "−"; float: left; padding-left: 6px; color: var(--bad); }
  .row.ins .n::before { content: "+"; float: left; padding-left: 6px; color: var(--ok); }
  .row.none .t { color: var(--muted); font-style: italic; }
  .legend { font-size: 12px; color: var(--muted); display: flex; gap: 14px; margin-top: 2px; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 4px; }

  .decide { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--border); }
  .dbtn { border: 1px solid var(--border); background: var(--card); color: var(--fg); padding: 6px 14px; border-radius: 6px; font: inherit; font-weight: 600; cursor: pointer; }
  .dbtn.ok:hover, .approved .dbtn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
  .dbtn.bad:hover, .rejected .dbtn.bad { background: var(--bad); border-color: var(--bad); color: #fff; }
  .overlap { width: 100%; border-left: 3px solid var(--warn); background: var(--soft); border-radius: 6px; padding: 8px 12px; }
  .clash .overlap { background: var(--warn-bg); font-weight: 600; }
  .decide textarea { flex: 1 1 320px; min-height: 36px; resize: vertical; font: inherit; font-size: 13px; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--fg); }
  .kbd { font-size: 12px; color: var(--muted); width: 100%; }
  kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--soft); }

  .export { margin-top: 28px; border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; background: var(--card); }
  .export h2 { font-size: 15px; margin: 0 0 8px; }
  .export textarea { width: 100%; min-height: 180px; font: 12.5px/1.5 var(--mono); padding: 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--fg); }
  .export .row2 { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  .saved { font-size: 13px; color: var(--muted); }
  .saved.ok { color: var(--ok); } .saved.bad { color: var(--warn); }
  .toast { color: var(--ok); font-size: 13px; }
  .empty { color: var(--muted); padding: 24px; text-align: center; }
</style>
</head>
<body>
<main>
  <h1 id="h1"></h1>
  <div class="sub" id="sub"></div>

  <div class="bar">
    <div class="clashes" id="clashes"></div>
    <div class="progress" id="progress"></div>
    <div class="seg" id="fstatus"></div>
    <div class="seg" id="fcat"></div>
    <div class="tools">
      <label class="chk"><input type="checkbox" id="wrap" checked> Wrap lines</label>
      <button class="btn" id="expand">Expand all</button>
      <button class="btn" id="reset" title="Clear all decisions and notes">Reset</button>
    </div>
  </div>

  <div id="list"></div>

  <section class="export">
    <h2>Decisions</h2>
    <div class="saved" id="saved"></div>
    <textarea id="md" readonly style="margin-top:8px"></textarea>
    <div class="row2">
      <button class="btn" id="copy">Copy</button>
      <button class="btn" id="dl">Download .md</button>
      <span class="toast" id="toast"></span>
    </div>
  </section>
</main>

<script>
const DATA = /*DATA*/null;
const SRC = DATA.source;
const FINDINGS = DATA.findings;
const CATS = ["All", ...new Set(FINDINGS.map(f => f.category))];
const STATUSES = ["All", "Pending", "Approved", "Rejected"];
const SERVED = location.protocol.startsWith("http");

let state = { updatedAt: 0, items: {} };
try { state = { ...state, ...JSON.parse(localStorage.getItem(DATA.key) || "{}") }; } catch {}
const st = id => state.items[id] || (state.items[id] = { d: null, note: "" });

let fStatus = "All", fCat = "All", focusId = null, saveTimer = null;
const open = new Set();

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const safeUrl = u => /^(https?:|mailto:|file:)/i.test(u) ? u : "#";
function inline(s) {
  return String(s ?? "").split(/(`[^`]+`)/).map(part => {
    if (/^`[^`]+`$/.test(part)) return `<code>${esc(part.slice(1, -1))}</code>`;
    return esc(part)
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, t, u) => `<a href="${esc(safeUrl(u))}" target="_blank" rel="noopener">${t}</a>`)
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*\w])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
  }).join("");
}
const para = s => String(s ?? "").split(/\n{2,}/).filter(p => p.trim()).map(p => `<p>${inline(p)}</p>`).join("");
const range = (a, b) => `${a}${b !== a ? "–" + b : ""}`;
const lineSpan = (a, b) => `${a === b ? "line" : "lines"} ${range(a, b)}`;
const linkName = u => /github\.com/.test(u) ? "View on GitHub ↗" : "View source ↗";
const link = u => u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${linkName(u)}</a>` : "";

function locOf(f) {
  const c = f.context[0];
  if (c) {
    const hl = c.highlight.length ? c.highlight : [c.start, c.end];
    return `${c.file}:${range(Math.min(...hl), Math.max(...hl))}`;
  }
  const x = f.fixes[0];
  return x ? `${x.file}:${range(x.start, x.end)}` : "";
}

function rowsHtml(lines, start, cls) {
  return lines.map((t, i) => {
    const n = start == null ? null : start + i;
    const c = typeof cls === "function" ? cls(n) : cls;
    return `<div class="row ${c}"><span class="g"></span><span class="n">${n ?? ""}</span><span class="t">${esc(t) || " "}</span></div>`;
  }).join("");
}

function contextHtml(c) {
  const hl = new Set(c.highlight), add = new Set(c.added);
  const label = c.label ? `${esc(c.label)} · ` : "";
  return `<div class="code"><div class="code-h"><span>${label}${esc(c.file)} ${lineSpan(c.start, c.end)}</span>${link(c.url)}</div>
    <div class="rows">${rowsHtml(c.lines, c.start, n => [hl.has(n) ? "hl" : "", add.has(n) ? "add" : ""].join(" "))}</div></div>`;
}

function fixHtml(x) {
  const label = x.label ? `${esc(x.label)} · ` : "";
  const del = x.start === x.end ? "(delete this line)" : "(delete these lines)";
  const ins = x.replacement === "" ? rowsHtml([del], null, "none") : rowsHtml(x.replacement.split("\n"), null, "ins");
  return `<div class="code"><div class="code-h"><span>${label}${esc(x.file)} replace ${lineSpan(x.start, x.end)}</span>${link(x.url)}</div>
    <div class="rows">${rowsHtml(x.lines, x.start, "del")}${ins}</div></div>`;
}

const ORIGIN = {
  new: [`new lines`, `Every line this touches was added by ${SRC.changeLabel}`],
  older: [`older lines`, `Every line this touches predates ${SRC.changeLabel}`],
  mixed: [`new + older lines`, `Touches lines added by ${SRC.changeLabel} and older lines`],
};

const conflictsOf = f => f.conflicts || [];
const clashesOf = f => st(f.id).d === "approved" ? conflictsOf(f).filter(id => st(id).d === "approved") : [];
const andList = xs => xs.length < 2 ? xs.join("") : `${xs.slice(0, -1).join(", ")} and ${xs.at(-1)}`;
const idLink = id => `<a href="#card-${esc(id)}" data-act="goto" data-target="${esc(id)}">${esc(id)}</a>`;

function overlapHtml(f) {
  const ids = conflictsOf(f);
  if (!ids.length) return "";
  const clashes = clashesOf(f);
  if (clashes.length) return `<div class="overlap">You approved this and ${andList(clashes.map(idLink))}, but they change the same lines, so only one fix can be applied. ${clashes.length === 1 ? "Reject one of them." : "Reject all but one."}</div>`;
  const named = ids.map(id => idLink(id) + (st(id).d ? ` (${st(id).d})` : ""));
  return `<div class="overlap">${andList(named)} ${ids.length === 1 ? "changes" : "change"} some of the same lines as this fix. Approve only one.</div>`;
}

function cardHtml(f) {
  const s = st(f.id);
  const cls = ["card", s.d || "", open.has(f.id) ? "open" : "", focusId === f.id ? "focus" : "",
               clashesOf(f).length ? "clash" : ""].join(" ");
  const icon = s.d === "approved" ? "✓" : s.d === "rejected" ? "✕" : "";
  const o = ORIGIN[f.origin];
  const originTag = o ? `<span class="tag ${f.origin !== "new" ? "older" : ""}" title="${esc(o[1])}">${o[0]}</span>` : "";
  const conflictTag = conflictsOf(f).length ? `<span class="tag conflict" title="These findings change some of the same lines">conflicts with ${esc(andList(conflictsOf(f)))}</span>` : "";
  const ev = f.evidence.length ? `<h3>Evidence</h3><ul class="ev">${f.evidence.map(e =>
    `<li>${e.url ? `<a href="${esc(safeUrl(e.url))}" target="_blank" rel="noopener">${inline(e.text)} ↗</a>` : inline(e.text)}</li>`).join("")}</ul>` : "";
  const legend = `<div class="legend"><span><i class="sw" style="background:var(--hl)"></i>problem lines</span>${
    SRC.base ? `<span><i class="sw" style="background:var(--add);opacity:.55"></i>added by ${esc(SRC.changeLabel)}</span>` : ""}</div>`;
  const context = f.context.length ? `<h3>In context</h3>${legend}${f.context.map(contextHtml).join("")}` : "";
  const proposal = f.fixes.length || f.fixNote ? `<h3>Proposed fix</h3>${para(f.fixNote)}${f.fixes.map(fixHtml).join("")}` : "";
  return `<article class="${cls}" id="card-${f.id}" data-id="${f.id}">
    <div class="head" data-act="toggle">
      <span class="status">${icon}</span>
      <span class="fid">${esc(f.id)}</span>
      <div><div class="title">${inline(f.title)}</div><div class="loc">${esc(locOf(f))}</div></div>
      <div class="tags"><span class="tag p${f.priority}">P${f.priority}</span><span class="tag">${esc(f.category)}</span>${originTag}${conflictTag}</div>
    </div>
    <div class="body">
      <h3>Problem</h3>${para(f.problem)}
      ${ev}
      ${f.counter ? `<h3>Why it might not be warranted</h3><div class="counter">${para(f.counter)}</div>` : ""}
      ${context}
      ${proposal}
      <div class="decide">
        ${overlapHtml(f)}
        <button class="dbtn ok" data-act="approved">✓ Approve</button>
        <button class="dbtn bad" data-act="rejected">✕ Reject</button>
        ${s.d ? `<button class="btn" data-act="clear">Undo</button>` : ""}
        <textarea data-act="note" placeholder="Note (optional): why, or how to adjust the fix">${esc(s.note)}</textarea>
        <div class="kbd">Keys: <kbd>a</kbd> approve · <kbd>r</kbd> reject · <kbd>u</kbd> undo · <kbd>j</kbd>/<kbd>k</kbd> next/previous · <kbd>Enter</kbd> expand or collapse</div>
      </div>
    </div>
  </article>`;
}

const inStatus = (f, s) => s === "All" || (s === "Pending" ? !st(f.id).d : st(f.id).d === s.toLowerCase());
const inCat = (f, c) => c === "All" || f.category === c;
const visible = () => FINDINGS.filter(f => inStatus(f, fStatus) && inCat(f, fCat));
const STATUS_CLS = { Pending: "c-pend", Approved: "c-ok", Rejected: "c-bad" };

function renderBar() {
  const n = FINDINGS.length;
  const a = FINDINGS.filter(f => st(f.id).d === "approved").length;
  const r = FINDINGS.filter(f => st(f.id).d === "rejected").length;
  const clashes = new Set(FINDINGS.flatMap(f => clashesOf(f).map(id => [f.id, id].sort().join(" and "))));
  document.getElementById("clashes").innerHTML = clashes.size
    ? `<span class="c-warn" title="Approved findings that change the same lines: ${esc([...clashes].join("; "))}"><b>${clashes.size}</b> ${clashes.size === 1 ? "conflict" : "conflicts"}</span>` : "";
  document.getElementById("progress").innerHTML =
    `<i style="width:${a / n * 100}%;background:var(--ok)"></i><i style="width:${r / n * 100}%;background:var(--bad)"></i>`;
  const seg = (el, items, cur, set, count, cls = () => "") => {
    el.innerHTML = items.map(x => {
      const k = x === "All" ? null : count(x);
      return `<button aria-pressed="${x === cur}"${k === 0 ? ' class="zero"' : ""}>${k == null ? "" : `<b class="${cls(x)}">${k}</b> `}${esc(x)}</button>`;
    }).join("");
    el.querySelectorAll("button").forEach((b, i) => b.onclick = () => { set(items[i]); render(); });
  };
  seg(document.getElementById("fstatus"), STATUSES, fStatus, v => fStatus = v,
      s => FINDINGS.filter(f => inStatus(f, s) && inCat(f, fCat)).length, s => STATUS_CLS[s]);
  seg(document.getElementById("fcat"), CATS, fCat, v => fCat = v,
      c => FINDINGS.filter(f => inStatus(f, fStatus) && inCat(f, c)).length);
}

function markdown() {
  const head = SRC.head ? ` (head ${SRC.head.slice(0, 8)})` : "";
  const lines = [`Decisions for ${DATA.title}${SRC.url ? ` ${SRC.url}` : ""}${head}`, ""];
  for (const d of ["approved", "rejected", null]) {
    const group = FINDINGS.filter(f => st(f.id).d === d);
    if (!group.length) continue;
    lines.push(`## ${d ? d[0].toUpperCase() + d.slice(1) : "Undecided"}`);
    for (const f of group) {
      const note = st(f.id).note.trim();
      lines.push(`- ${f.id}: ${f.title} (${locOf(f)})${note ? `\n  - Note: ${note.replace(/\n/g, " ")}` : ""}`);
    }
    lines.push("");
  }
  return lines.join("\n").trim() + "\n";
}

function savedStatus(kind, text) {
  const el = document.getElementById("saved");
  el.className = "saved " + kind; el.textContent = text;
}

function payload() {
  return {
    key: DATA.key, title: DATA.title, updatedAt: state.updatedAt, markdown: markdown(),
    decisions: FINDINGS.map(f => ({ id: f.id, title: f.title, decision: st(f.id).d, note: st(f.id).note })),
  };
}

function save() {
  state.updatedAt = Date.now();
  try { localStorage.setItem(DATA.key, JSON.stringify(state)); } catch {}
  if (!SERVED) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      const r = await fetch("decisions", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload()) });
      if (!r.ok) throw new Error(r.status);
      savedStatus("ok", "Saved to decisions.json in the dashboard folder. Tell the agent when you're done.");
    } catch {
      savedStatus("bad", "Couldn't reach the dashboard server, so decisions are saved in this browser only. Copy the Markdown below into the chat when you're done.");
    }
  }, 300);
}

async function loadFromServer() {
  if (!SERVED) {
    savedStatus("", "Decisions are saved in this browser only. Copy the Markdown below into the chat when you're done.");
    return;
  }
  savedStatus("", "Decisions save to decisions.json in the dashboard folder as you go.");
  try {
    const r = await fetch("decisions.json", { cache: "no-store" });
    if (!r.ok) return;
    const saved = await r.json();
    if (saved.key !== DATA.key || !(saved.updatedAt > state.updatedAt)) return;
    state = { updatedAt: saved.updatedAt, items: {} };
    for (const d of saved.decisions || []) state.items[d.id] = { d: d.decision, note: d.note || "" };
    try { localStorage.setItem(DATA.key, JSON.stringify(state)); } catch {}
    render();
  } catch {}
}

function render() {
  renderBar();
  const v = visible(), wrap = document.getElementById("wrap").checked;
  document.getElementById("list").innerHTML = v.length ? v.map(cardHtml).join("") : `<div class="empty">Nothing matches these filters.</div>`;
  document.getElementById("list").classList.toggle("wrap", wrap);
  document.querySelectorAll(".rows").forEach(el => el.classList.toggle("wrap", wrap));
  document.getElementById("md").value = markdown();
  document.getElementById("expand").textContent = v.length && v.every(f => open.has(f.id)) ? "Collapse all" : "Expand all";
}

function nextPending(afterId) {
  const v = visible(), i = v.findIndex(f => f.id === afterId);
  return [...v.slice(i + 1), ...v.slice(0, i)].find(f => !st(f.id).d);
}

function decide(id, d) {
  st(id).d = d; save();
  if (d) {
    open.delete(id);
    const nxt = nextPending(id);
    if (nxt) { open.add(nxt.id); focusId = nxt.id; }
  }
  render();
  if (focusId) document.getElementById("card-" + focusId)?.scrollIntoView({ block: "start", behavior: "smooth" });
}

document.getElementById("list").addEventListener("click", e => {
  const card = e.target.closest(".card"); if (!card) return;
  const id = card.dataset.id, act = e.target.closest("[data-act]")?.dataset.act;
  focusId = id;
  if (act === "toggle") { open.has(id) ? open.delete(id) : open.add(id); render(); }
  else if (act === "approved" || act === "rejected") decide(id, st(id).d === act ? null : act);
  else if (act === "clear") decide(id, null);
  else if (act === "goto") {
    e.preventDefault();
    const target = e.target.closest("[data-target]").dataset.target;
    if (!visible().some(f => f.id === target)) { fStatus = "All"; fCat = "All"; }
    open.add(target); focusId = target; render();
    document.getElementById("card-" + target)?.scrollIntoView({ block: "start", behavior: "smooth" });
  }
});
document.getElementById("list").addEventListener("input", e => {
  if (e.target.dataset.act !== "note") return;
  st(e.target.closest(".card").dataset.id).note = e.target.value; save();
  document.getElementById("md").value = markdown();
});
document.getElementById("wrap").onchange = render;
document.getElementById("expand").onclick = () => {
  const v = visible(), all = v.every(f => open.has(f.id));
  v.forEach(f => all ? open.delete(f.id) : open.add(f.id)); render();
};
document.getElementById("reset").onclick = () => {
  if (!confirm("Clear all decisions and notes?")) return;
  state = { updatedAt: 0, items: {} }; save(); render();
};
const toast = t => { const el = document.getElementById("toast"); el.textContent = t; setTimeout(() => el.textContent = "", 1800); };
document.getElementById("copy").onclick = async () => {
  const ta = document.getElementById("md");
  try { await navigator.clipboard.writeText(ta.value); toast("Copied"); }
  catch { ta.select(); document.execCommand("copy"); toast("Copied"); }
};
document.getElementById("dl").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([document.getElementById("md").value], { type: "text/markdown" }));
  a.download = DATA.title.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") + "-decisions.md";
  a.click();
};
document.addEventListener("keydown", e => {
  if (e.target.matches("textarea, input") || e.metaKey || e.ctrlKey || e.altKey) return;
  const v = visible(); if (!v.length) return;
  let i = Math.max(0, v.findIndex(f => f.id === focusId));
  const go = j => { focusId = v[j].id; open.add(focusId); render(); document.getElementById("card-" + focusId).scrollIntoView({ block: "start", behavior: "smooth" }); };
  if (e.key === "j") go(Math.min(v.length - 1, focusId ? i + 1 : 0));
  else if (e.key === "k") go(Math.max(0, i - 1));
  else if (focusId && e.key === "a") decide(focusId, "approved");
  else if (focusId && e.key === "r") decide(focusId, "rejected");
  else if (focusId && e.key === "u") decide(focusId, null);
  else if (focusId && e.key === "Enter") { open.has(focusId) ? open.delete(focusId) : open.add(focusId); render(); }
  else return;
  e.preventDefault();
});

document.title = DATA.title;
document.getElementById("h1").textContent = DATA.title;
const srcLabel = SRC.url ? `<a href="${esc(safeUrl(SRC.url))}" target="_blank" rel="noopener">${esc(SRC.label)}</a>` : esc(SRC.label);
document.getElementById("sub").innerHTML = [srcLabel, SRC.head ? `head <code>${esc(SRC.head.slice(0, 8))}</code>` : "",
  `${FINDINGS.length} findings`].filter(Boolean).join(" · ");
const firstPending = FINDINGS.find(f => !st(f.id).d);
if (firstPending) { open.add(firstPending.id); focusId = firstPending.id; }
render();
loadFromServer();
</script>
</body>
</html>
